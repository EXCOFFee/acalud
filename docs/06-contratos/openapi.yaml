openapi: 3.1.0
info:
  title: Acalud API
  version: 1.0.0
  description: >
    Contrato de la API REAL del monolito modular (ADR-002), reescrito desde el código
    (2026-11). Reemplaza al contrato v1 de `docs/_archivo-v1/.../openapi.yaml`, que describía
    un diseño previo y quedó como material histórico.

    Convenciones: errores en RFC 9457 (`application/problem+json`, con `trace_id`); validación
    de entrada con Zod → 422; recurso ajeno → 404 (nunca 403, salvo rol admin); autenticación
    dual (ADR-004): cookie httpOnly `acalud_sesion` (web) o `Authorization: Bearer` (APK).

    Nombres: las rutas y campos se documentan TAL COMO EXISTEN hoy (mezcla español/inglés).
    Unificarlos al inglés es la Fase 2 (docs/claude/04-workflow.md).

    Sincronía: `packages/contracts/test/drift.spec.ts` compara este archivo contra los
    controllers de `apps/api` y falla en CI si se desfasan.
servers:
  - url: /api/v1

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: sistema
    description: Salud del servicio (monitor de uptime / keep-alive, ADR-005).
  - name: identidad
    description: Cuentas, sesión y perfil (BC Identidad · CU-01..04, CU-34, CU-E01, CU-E02).
  - name: catalogo
    description: Catálogo público, demos, descargas, editoriales y favoritos (CU-06..09, CU-17, CU-18).
  - name: compras
    description: >
      Carrito, cotización de envío, checkout con Mercado Pago, webhook de pago, historial y
      seguimiento (CU-05, CU-10..13, CU-24). El cliente NUNCA envía precios ni totales.
  - name: institucional
    description: >
      Instituciones, inventario y licencias, docentes, sesiones de juego, reportes y
      dashboard (CU-23, CU-25..33). Todas requieren sesión. Las rutas
      `/instituciones/{institucion_id}/...` exigen ser el encargado ACTIVO de esa institución:
      si no lo sos responde 404 (no 403), igual que con un recurso ajeno.
  - name: comunidad
    description: >
      Encuestas, propuestas de docentes y catálogo de niveles/materias (CU-14..16, CU-20,
      CU-21). OJO: acá los query params están en inglés (`status`, `search`, `order`,
      `level_id`), a diferencia de otros módulos (Fase 2).
  - name: admin-catalogo
    description: >
      ABM de productos (+ descuento mayorista CU-22), categorías, demos y recursos (CU-19).
      Todas requieren sesión de un usuario con `role = admin` (AuthGuard + AdminGuard → 403) y
      quedan auditadas en `audit_log`.

paths:
  /health:
    get:
      tags: [sistema]
      summary: Liveness — el proceso responde
      operationId: health
      security: []
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /ready:
    get:
      tags: [sistema]
      summary: Readiness — el proceso y la base responden (`SELECT 1`, timeout 5 s)
      operationId: ready
      security: []
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: La base no responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  # ───────────────────────── IDENTIDAD ─────────────────────────
  /auth/registro:
    post:
      tags: [identidad]
      summary: Registrar docente (CU-01)
      description: >
        Crea la cuenta (`no_verificada`) y encola el email de verificación. La respuesta es
        idéntica exista o no el email (anti-enumeración). La cuenta queda operativa desde el
        registro, con capacidades limitadas hasta verificar.
      operationId: registrarDocente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroInput' }
      responses:
        '201':
          description: Registro aceptado (mismo mensaje exista o no el email)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '422':
          description: Entrada inválida o contraseña en lista de filtradas (PA-01)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/verificacion:
    post:
      tags: [identidad]
      summary: Verificar email con el token del enlace (CU-E02)
      description: Activa la cuenta e inicia sesión (setea la cookie y devuelve el token).
      operationId: verificarEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '200':
          description: Cuenta verificada y sesión iniciada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieSesion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '410': { $ref: '#/components/responses/Problem410' }
        '422': { $ref: '#/components/responses/Problem422' }

  /auth/recuperacion:
    post:
      tags: [identidad]
      summary: Solicitar recuperación de contraseña (CU-E01)
      description: Respuesta idéntica exista o no el email (anti-enumeración).
      operationId: solicitarRecuperacion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Solicitud aceptada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '422': { $ref: '#/components/responses/Problem422' }

  /auth/recuperacion/restablecer:
    post:
      tags: [identidad]
      summary: Fijar contraseña nueva con el token (CU-E01)
      description: Invalida TODAS las sesiones activas de la cuenta.
      operationId: restablecerContrasena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, contrasena_nueva]
              properties:
                token: { type: string, minLength: 1 }
                contrasena_nueva: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '410': { $ref: '#/components/responses/Problem410' }
        '422':
          description: Entrada inválida o contraseña en lista de filtradas
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/cambio-correo/confirmar:
    post:
      tags: [identidad]
      summary: Confirmar cambio de correo con el token enviado al correo nuevo (CU-34)
      description: >
        Efectiviza el cambio, marca el email como verificado y notifica a ambas direcciones.
        No cierra la sesión activa (RN-004).
      operationId: confirmarCambioCorreo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '200':
          description: Correo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '410': { $ref: '#/components/responses/Problem410' }
        '422': { $ref: '#/components/responses/Problem422' }

  /auth/sesion:
    post:
      tags: [identidad]
      summary: Iniciar sesión (CU-02)
      description: >
        Sesión opaca server-side (ADR-004), transporte dual: el token sale en la cookie
        httpOnly (web) y en el cuerpo (APK → Bearer). Vigencia 7 días deslizante. Bloqueo por
        fuerza bruta: 3 fallos en 15 minutos (RN-007). Mensajes genéricos y tiempo constante
        (anti-enumeración).
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, contrasena]
              properties:
                email: { type: string, format: email }
                contrasena: { type: string, minLength: 1 }
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieSesion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '401': { $ref: '#/components/responses/Problem401' }
        '422': { $ref: '#/components/responses/Problem422' }
        '423':
          description: Cuenta temporalmente bloqueada por intentos fallidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [identidad]
      summary: Cerrar sesión (CU-03)
      description: >
        Borra la sesión del store (revocación inmediata) y limpia la cookie. Idempotente:
        responde 204 aunque no haya sesión.
      operationId: cerrarSesion
      security: []
      responses:
        '204':
          description: Sesión cerrada (o no había)

  /me:
    get:
      tags: [identidad]
      summary: Ver perfil propio (CU-04)
      operationId: verPerfil
      responses:
        '200':
          description: Perfil de la cuenta autenticada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPropio' }
        '401': { $ref: '#/components/responses/Problem401' }
    put:
      tags: [identidad]
      summary: Actualizar perfil propio (CU-04)
      description: >
        Reemplaza nombre, apellido y datos docentes. `nivel_educativo` y `materia` deben ser
        nombres existentes en `GET /levels` / `GET /subjects` (sin distinguir mayúsculas);
        `null` o ausente los deja vacíos. Un nombre inexistente → 422 (antes se guardaba null
        en silencio). Nombre/apellido de solo espacios → 422.
      operationId: actualizarPerfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilInput' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPropio' }
        '401': { $ref: '#/components/responses/Problem401' }
        '422': { $ref: '#/components/responses/Problem422' }

  /me/cambio-correo:
    post:
      tags: [identidad]
      summary: Solicitar cambio de correo (CU-34)
      description: >
        No cambia el correo todavía: valida la contraseña vigente y envía un enlace (24 h) al
        correo NUEVO. El cambio se efectiviza con `POST /auth/cambio-correo/confirmar`.
      operationId: solicitarCambioCorreo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nuevo_email, contrasena]
              properties:
                nuevo_email: { type: string, format: email }
                contrasena: { type: string, minLength: 1 }
      responses:
        '202':
          description: Enlace de verificación enviado al correo nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '401':
          description: No autenticado, o contraseña vigente incorrecta
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Entrada inválida, correo ya registrado o igual al actual
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────── CATÁLOGO PÚBLICO ─────────────────────────
  /catalogo/juegos:
    get:
      tags: [catalogo]
      summary: Listar juegos publicados (CU-06)
      operationId: listarJuegos
      security: []
      parameters:
        - { name: q, in: query, description: Búsqueda por texto, schema: { type: string, minLength: 1 } }
        - { name: area, in: query, description: Filtro por área/categoría, schema: { type: string, minLength: 1 } }
        - { $ref: '#/components/parameters/pagina' }
        - name: tamanio
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 20 }
      responses:
        '200':
          description: Página de juegos activos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListadoJuegos' }
        '422': { $ref: '#/components/responses/Problem422' }

  /catalogo/juegos/{juego_id}:
    get:
      tags: [catalogo]
      summary: Ver ficha de un juego (CU-06)
      description: >
        Público, con sesión opcional. `recursos[].desbloqueado`: los libres siempre; los
        licenciados solo si hay sesión y el usuario tiene derecho al juego (compra
        paid/shipped/delivered o licencia institucional asignada) — la misma regla que
        autoriza `POST /catalogo/recursos/{recurso_id}/descarga`. Una sesión inválida se
        trata como anónima (200, no 401).
      operationId: verJuego
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/juego_id' }
      responses:
        '200':
          description: Ficha completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JuegoDetalle' }
        '404': { $ref: '#/components/responses/Problem404' }

  /catalogo/juegos/{juego_id}/demo/publica:
    get:
      tags: [catalogo]
      summary: Probar demo pública (CU-06, sin sesión)
      operationId: probarDemoPublica
      security: []
      parameters:
        - { $ref: '#/components/parameters/juego_id' }
      responses:
        '200':
          description: Datos para embeber la demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContenidoDemo' }
        '404':
          description: El juego no existe o no tiene demo pública
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /catalogo/juegos/{juego_id}/demo/completa:
    get:
      tags: [catalogo]
      summary: Probar demo completa (CU-07, requiere sesión)
      description: Registra la prueba en `game_progress`.
      operationId: probarDemoCompleta
      parameters:
        - { $ref: '#/components/parameters/juego_id' }
      responses:
        '200':
          description: Datos para embeber la demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContenidoDemo' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: El juego no existe o no tiene demo completa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /catalogo/recursos/{recurso_id}/descarga:
    post:
      tags: [catalogo]
      summary: Descargar recurso libre o licenciado (CU-08, CU-09)
      description: >
        Sesión opcional. Libre → cualquiera. Licenciado → requiere sesión y que el usuario haya
        comprado el juego o tenga una licencia institucional asignada. Los PDF devuelven una
        URL firmada de Supabase Storage válida 5 minutos; los enlaces externos, la URL tal cual
        (sin `expira_en`). Registra la descarga y suma la métrica.
      operationId: descargarRecurso
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/recurso_id' }
      responses:
        '201':
          description: Enlace de descarga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnlaceDescarga' }
        '401':
          description: Recurso licenciado y no hay sesión
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Recurso licenciado sin derecho de acceso (no comprado ni asignado)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem404' }

  /editorial-partners:
    get:
      tags: [catalogo]
      summary: Listar editoriales aliadas (CU-17)
      operationId: listarEditoriales
      security: []
      parameters:
        - { name: category, in: query, description: Categoría (texto libre), schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Editoriales activas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EditorialResumen' }
        '422': { $ref: '#/components/responses/Problem422' }

  /editorial-partners/{partner_id}:
    get:
      tags: [catalogo]
      summary: Ver detalle de una editorial (CU-17)
      description: Sesión opcional. Registra el evento `editorial_partner_viewed`.
      operationId: verEditorial
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/partner_id' }
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditorialDetalle' }
        '404': { $ref: '#/components/responses/Problem404' }

  /editorial-partners/{partner_id}/click:
    post:
      tags: [catalogo]
      summary: Registrar clic en "Ir al sitio web" (CU-17 RN-007)
      description: >
        Sesión opcional. Evento `editorial_partner_clicked` (o `_anonymous`). El frontend lo
        llama sin esperar la respuesta: nunca bloquea la navegación.
      operationId: registrarClickEditorial
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/partner_id' }
      responses:
        '204': { description: Registrado }
        '404': { $ref: '#/components/responses/Problem404' }

  /favorites:
    get:
      tags: [catalogo]
      summary: Ver mis favoritos (CU-18 A9)
      operationId: verMisFavoritos
      responses:
        '200':
          description: Favoritos del usuario, con el título resuelto
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FavoritoResumen' }
        '401': { $ref: '#/components/responses/Problem401' }
    post:
      tags: [catalogo]
      summary: Guardar favorito (CU-18)
      description: Exactamente UNO de `producto_id`, `recurso_id` o `editorial_id`.
      operationId: guardarFavorito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoritoInput' }
      responses:
        '201':
          description: Favorito guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorito' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: El producto/recurso/editorial no existe
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Ya estaba en favoritos (RN-001, índice único parcial)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }

  /favorites/{favorito_id}:
    delete:
      tags: [catalogo]
      summary: Quitar favorito (CU-18 A7)
      operationId: eliminarFavorito
      parameters:
        - name: favorito_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }

  # ───────────────────────── COMPRAS ─────────────────────────
  /carrito:
    get:
      tags: [compras]
      summary: Ver carrito (CU-10; institucional con `contexto`, CU-24)
      description: >
        Un carrito por (cuenta, contexto). Precios y descuentos por cantidad calculados en el
        servidor al momento de leer.
      operationId: verCarrito
      parameters:
        - { $ref: '#/components/parameters/contexto' }
      responses:
        '200':
          description: Carrito (vacío si no existe)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarritoView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: '`contexto` de una institución de la que no sos encargado activo'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }

  /carrito/lineas/{juego_id}:
    put:
      tags: [compras]
      summary: Poner un juego en el carrito con una cantidad, upsert (CU-10)
      description: Fija la cantidad (no la suma). El cliente manda SOLO la cantidad.
      operationId: ponerLineaCarrito
      parameters:
        - { $ref: '#/components/parameters/juego_id' }
        - { $ref: '#/components/parameters/contexto' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad]
              properties:
                cantidad: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200':
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarritoView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: Juego inexistente/inactivo, o `contexto` institucional ajeno
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }
    delete:
      tags: [compras]
      summary: Quitar un juego del carrito (CU-10)
      operationId: quitarLineaCarrito
      parameters:
        - { $ref: '#/components/parameters/juego_id' }
        - { $ref: '#/components/parameters/contexto' }
      responses:
        '200':
          description: Carrito actualizado (idempotente si el juego no estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarritoView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: '`contexto` institucional ajeno'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /shipping/calculate:
    post:
      tags: [compras]
      summary: Cotizar envío (CU-11)
      description: >
        Sin sesión (A8: sirve también a un carrito anónimo). Cotiza contra el
        `ShippingProvider` configurado (`SHIPPING_ADAPTER`; en producción hoy `tabla`:
        700 + 300 por kg iniciado, igual para ambas modalidades). Peso por producto con
        fallback a un peso por defecto (A5). Opciones ordenadas de menor a mayor costo. No
        persiste nada. Es exactamente el costo que después cobra `POST /checkout`, que
        recalcula esta misma cotización en el servidor.
      operationId: calcularEnvio
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo_postal, items]
              properties:
                codigo_postal: { type: string, pattern: '^\d{4}$', examples: ['1900'] }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Opciones de envío
          content:
            application/json:
              schema:
                type: object
                required: [opciones]
                properties:
                  opciones:
                    type: array
                    items: { $ref: '#/components/schemas/OpcionEnvio' }
        '422': { $ref: '#/components/responses/Problem422' }
        '503': { $ref: '#/components/responses/Problem503' }

  /checkout:
    post:
      tags: [compras]
      summary: Iniciar checkout y crear la preferencia de Mercado Pago (CU-12 p1-3, CU-24)
      description: >
        En una transacción: calcula precios en el servidor, verifica stock y crea el pedido
        `pending` con snapshot de precios (y `billing_data` si es B2B). Fuera de la
        transacción crea la preferencia de Checkout Pro y devuelve su `init_point` para
        redirigir. Un solo pedido pendiente por carrito (índice único). Costo de envío: la
        MISMA cotización de `POST /shipping/calculate` para la modalidad elegida, recalculada
        en el servidor ANTES de la transacción (puede ser una llamada externa); adentro se
        relee el carrito y, si cambió entre medio, responde 422 sin crear el pedido.
      operationId: iniciarCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modalidad_envio, codigo_postal, domicilio]
              properties:
                contexto: { type: string, format: uuid, description: institution_id (CU-24); ausente = personal }
                modalidad_envio: { $ref: '#/components/schemas/ModalidadEnvio' }
                codigo_postal: { type: string, minLength: 1 }
                domicilio:
                  type: object
                  required: [calle, numero, codigo_postal, provincia, localidad]
                  properties:
                    calle: { type: string, minLength: 1 }
                    numero: { type: string, minLength: 1 }
                    codigo_postal: { type: string, minLength: 1 }
                    provincia: { type: string, minLength: 1 }
                    localidad: { type: string, minLength: 1 }
      responses:
        '201':
          description: Pedido creado; redirigir al usuario a `init_point`
          content:
            application/json:
              schema:
                type: object
                required: [pedido_id, init_point]
                properties:
                  pedido_id: { type: string, format: uuid }
                  init_point: { type: string, format: uri, description: URL de Checkout Pro }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: '`contexto` institucional ajeno'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Ya hay un pago en curso para este carrito
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Entrada inválida, carrito vacío, sin stock suficiente, o el carrito cambió durante el checkout
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Cotizador de envíos o Mercado Pago no disponibles
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /webhooks/mercadopago:
    post:
      tags: [compras]
      summary: Notificación de pago de Mercado Pago (CU-12 p4-6)
      description: >
        Lo llama Mercado Pago, no el frontend. Autenticación por firma, no por sesión:
        `x-signature: ts=<epoch>,v1=<hmac>` = HMAC-SHA256 con `MP_WEBHOOK_SECRET` sobre
        `id:<data.id>;request-id:<x-request-id>;ts:<ts>;`. La firma NO cubre el body, por eso
        el servidor no lo lee: reconcilia consultando el pago a Mercado Pago. Procesamiento
        idempotente (`payment_id` UNIQUE) en una sola transacción: estado del pedido con guard
        `WHERE status = 'pending'`, descuento condicional de stock, inventario institucional
        (B2B), vaciado de carrito, email por outbox y auditoría. Responde 200 ante cualquier
        resultado de negocio para que Mercado Pago no reintente.
      operationId: webhookMercadoPago
      security: []
      parameters:
        - name: data.id
          in: query
          required: true
          description: payment_id de Mercado Pago
          schema: { type: string, minLength: 1 }
        - name: x-signature
          in: header
          required: true
          schema: { type: string, examples: ['ts=1700000000,v1=3f2a...'] }
        - name: x-request-id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Notificación procesada (o ya procesada)
          content:
            application/json:
              schema:
                type: object
                required: [resultado]
                properties:
                  resultado:
                    type: string
                    enum: [paid, rejected, under_review, already_processed, order_not_found]
        '401':
          description: Firma inválida o ausente; se descarta sin tocar ningún pedido (A7)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }

  /pedidos:
    get:
      tags: [compras]
      summary: Historial de compras propio (CU-05, CU-24 RN-009)
      operationId: verHistorialPedidos
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoPedido' }
        - name: order_type
          in: query
          schema: { type: string, enum: [b2c, b2b] }
        - name: orden_por
          in: query
          schema: { type: string, enum: [created_at, total_amount], default: created_at }
        - name: orden_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - { $ref: '#/components/parameters/pagina' }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de pedidos del usuario
          content:
            application/json:
              schema:
                type: object
                required: [items, total_items, total_paginas, pagina_actual]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrdenHistorial' }
                  total_items: { type: integer }
                  total_paginas: { type: integer }
                  pagina_actual: { type: integer }
        '401': { $ref: '#/components/responses/Problem401' }
        '422': { $ref: '#/components/responses/Problem422' }

  /pedidos/{pedido_id}:
    get:
      tags: [compras]
      summary: Detalle de un pedido propio (CU-05)
      operationId: verDetallePedido
      parameters:
        - { $ref: '#/components/parameters/pedido_id' }
      responses:
        '200':
          description: Detalle con líneas, domicilio y facturación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetallePedido' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }

  /pedidos/{pedido_id}/tracking:
    get:
      tags: [compras]
      summary: Seguimiento logístico de un pedido propio (CU-13)
      description: >
        El código de tracking se resuelve en el servidor (no viaja en la URL, RNF-009). Caché
        de 5 min en `order_tracking_events` (RN-003); si el proveedor falla se devuelve el
        último estado conocido (`desde_cache = true`, RNF-007). Con el adapter `tabla` no hay
        proveedor de tracking: sin caché previa responde 503.
      operationId: verSeguimientoPedido
      parameters:
        - { $ref: '#/components/parameters/pedido_id' }
      responses:
        '200':
          description: Estado y eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeguimientoPedido' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409':
          description: El pedido no tiene código de tracking o todavía no se despachó (A1/A4)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem503' }

  # ───────────────────────── INSTITUCIONAL ─────────────────────────
  /instituciones/mine:
    get:
      tags: [institucional]
      summary: A qué institución pertenezco
      description: >
        Siempre 200 con un objeto (nunca `null` crudo). `institucion_id = null` si el usuario no
        está vinculado. `datos_facturacion_envio` (precarga del checkout B2B, CU-24) solo se
        devuelve al ENCARGADO; para un docente común es null. Su `domicilio` es null si la
        institución no lo cargó.
      operationId: verMiInstitucion
      responses:
        '200':
          description: Membresía del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiInstitucion' }
        '401': { $ref: '#/components/responses/Problem401' }

  /instituciones:
    post:
      tags: [institucional]
      summary: Registrar institución educativa (CU-23)
      description: El usuario que la registra queda como su encargado (is_admin, activo).
      operationId: registrarInstitucion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitucionInput' }
      responses:
        '201':
          description: Institución registrada
          content:
            application/json:
              schema:
                type: object
                required: [institucion_id]
                properties:
                  institucion_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Problem401' }
        '409':
          description: CUIT o email institucional ya registrados, o el usuario ya está vinculado a otra institución (A1/A2/A3)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Entrada inválida (CUIT sin 11 dígitos, etc.) o nivel educativo inexistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /instituciones/{institucion_id}/inventario:
    get:
      tags: [institucional]
      summary: Ver tenencia de licencias (CU-25)
      operationId: verInventario
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - name: producto_id
          in: query
          schema: { type: string, format: uuid }
        - name: orden
          in: query
          schema: { type: string, enum: [cantidad_adquirida, cantidad_asignada, cantidad_disponible, ultima_compra, nombre] }
        - { $ref: '#/components/parameters/direccion' }
      responses:
        '200':
          description: Resumen e ítems del inventario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventarioInstitucional' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /instituciones/{institucion_id}/inventario/{producto_id}:
    get:
      tags: [institucional]
      summary: Detalle de un producto del inventario (CU-25 A7)
      operationId: verDetalleInventario
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/producto_id' }
      responses:
        '200':
          description: Historial de compras y docentes con licencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleProductoInventario' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }

  /instituciones/{institucion_id}/asignaciones:
    post:
      tags: [institucional]
      summary: Asignar licencias a docentes (CU-26)
      description: >
        Una línea por docente (no se permite repetir docente en el mismo pedido). Todo o nada:
        si no alcanzan las licencias disponibles, no se asigna ninguna.
      operationId: asignarLicencias
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [producto_id, asignaciones]
              properties:
                producto_id: { type: string, format: uuid }
                asignaciones:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [docente_id, cantidad]
                    properties:
                      docente_id: { type: string, format: uuid, description: 'Id de la membresía (institutional_teachers), no del usuario' }
                      cantidad: { type: integer, minimum: 1 }
                observaciones: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Licencias asignadas
          content:
            application/json:
              schema:
                type: object
                required: [producto_id, asignaciones, cantidad_disponible]
                properties:
                  producto_id: { type: string, format: uuid }
                  asignaciones:
                    type: array
                    items:
                      type: object
                      required: [asignacion_id, docente_id, cantidad]
                      properties:
                        asignacion_id: { type: string, format: uuid }
                        docente_id: { type: string, format: uuid }
                        cantidad: { type: integer }
                  cantidad_disponible: { type: integer, description: Ya actualizada }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: No sos encargado, o el producto no está en el inventario
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Licencias insuficientes, docente no vinculado o entrada inválida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /instituciones/{institucion_id}/revocaciones:
    post:
      tags: [institucional]
      summary: Revocar licencias a un docente, parcial o total (CU-27)
      description: >
        Por (docente, producto, cantidad), consumiendo las asignaciones activas en orden FIFO.
        Responde 200 (no crea un recurso nuevo: cambia el estado de asignaciones existentes).
      operationId: revocarLicencias
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docente_id, producto_id, cantidad_a_revocar]
              properties:
                docente_id: { type: string, format: uuid }
                producto_id: { type: string, format: uuid }
                cantidad_a_revocar: { type: integer, minimum: 1 }
                observaciones: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Licencias revocadas
          content:
            application/json:
              schema:
                type: object
                required: [producto_id, docente_id, cantidad_revocada, cantidad_restante]
                properties:
                  producto_id: { type: string, format: uuid }
                  docente_id: { type: string, format: uuid }
                  cantidad_revocada: { type: integer }
                  cantidad_restante: { type: integer, description: Lo que le queda asignado al docente }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: No sos encargado o no hay asignación activa de ese producto al docente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: La cantidad supera lo asignado, o entrada inválida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /instituciones/{institucion_id}/docentes/asignaciones:
    get:
      tags: [institucional]
      summary: Docentes vinculados con sus licencias (CU-28)
      description: Incluye docentes con 0 licencias (RN-002).
      operationId: verDocentesAsignados
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - name: producto_id
          in: query
          schema: { type: string, format: uuid }
        - name: buscar
          in: query
          description: Por nombre o email
          schema: { type: string, maxLength: 200 }
        - name: orden
          in: query
          schema: { type: string, enum: [total_licencias, nombre] }
        - { $ref: '#/components/parameters/direccion' }
      responses:
        '200':
          description: Resumen y docentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListadoDocentesAsignados' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /instituciones/{institucion_id}/docentes/asignaciones/{docente_id}:
    get:
      tags: [institucional]
      summary: Detalle de asignaciones de un docente, incluidas las revocadas (CU-28 A9)
      operationId: verDetalleDocenteAsignaciones
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/docente_id' }
      responses:
        '200':
          description: Historial completo del docente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleDocenteAsignaciones' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }

  /instituciones/{institucion_id}/reportes/uso:
    get:
      tags: [institucional]
      summary: Reporte de uso institucional (CU-31)
      description: >
        Agregado por juego o por docente, con KPIs, serie temporal y nube de palabras de los
        aprendizajes clave (hasta 30 palabras).
      operationId: verReporteUso
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - name: corte
          in: query
          schema: { type: string, enum: [juego, docente], default: juego }
        - { $ref: '#/components/parameters/desde' }
        - { $ref: '#/components/parameters/hasta' }
        - { $ref: '#/components/parameters/filtro_producto_id' }
        - { $ref: '#/components/parameters/filtro_docente_id' }
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteInstitucional' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /instituciones/{institucion_id}/reportes/uso/producto/{producto_id}:
    get:
      tags: [institucional]
      summary: Detalle del reporte para un juego (CU-31 A8)
      operationId: verDetalleReporteJuego
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/producto_id' }
        - { $ref: '#/components/parameters/desde' }
        - { $ref: '#/components/parameters/hasta' }
        - { $ref: '#/components/parameters/filtro_docente_id' }
      responses:
        '200':
          description: Detalle del juego
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleReporteJuego' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /instituciones/{institucion_id}/reportes/uso/docente/{docente_id}:
    get:
      tags: [institucional]
      summary: Detalle del reporte para un docente (CU-31 A9)
      operationId: verDetalleReporteDocente
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/docente_id' }
        - { $ref: '#/components/parameters/desde' }
        - { $ref: '#/components/parameters/hasta' }
        - { $ref: '#/components/parameters/filtro_producto_id' }
      responses:
        '200':
          description: Detalle del docente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleReporteDocente' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /instituciones/{institucion_id}/reportes/uso/exportar:
    get:
      tags: [institucional]
      summary: Exportar el reporte de uso a Excel o PDF (CU-32)
      description: Siempre incluye juegos y docentes (no usa `corte`). Descarga como adjunto.
      operationId: exportarReporteUso
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/formato_export' }
        - { $ref: '#/components/parameters/desde' }
        - { $ref: '#/components/parameters/hasta' }
        - { $ref: '#/components/parameters/filtro_producto_id' }
        - { $ref: '#/components/parameters/filtro_docente_id' }
      responses:
        '200': { $ref: '#/components/responses/ArchivoExportado' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: No sos encargado, o no hay sesiones con esos filtros (A2)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: El archivo generado supera 10 MB (RNF-002/A3)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Más de 5000 filas (PI-04) o entrada inválida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /instituciones/{institucion_id}/dashboard:
    get:
      tags: [institucional]
      summary: Dashboard pedagógico (CU-33)
      description: >
        Sin fechas: últimos 30 días hasta ahora. Cada KPI trae su variación porcentual
        (redondeada) contra el período anterior de igual duración. Si el anterior fue 0: 100
        cuando el actual es mayor a 0, null cuando ambos son 0.
      operationId: verDashboard
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/desde' }
        - { $ref: '#/components/parameters/hasta' }
        - { $ref: '#/components/parameters/filtro_producto_id' }
        - { $ref: '#/components/parameters/filtro_docente_id' }
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPedagogico' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /instituciones/{institucion_id}/dashboard/exportar:
    get:
      tags: [institucional]
      summary: Exportar el dashboard a Excel o PDF (CU-33 A9)
      operationId: exportarDashboard
      parameters:
        - { $ref: '#/components/parameters/institucion_id' }
        - { $ref: '#/components/parameters/formato_export' }
        - { $ref: '#/components/parameters/desde' }
        - { $ref: '#/components/parameters/hasta' }
        - { $ref: '#/components/parameters/filtro_producto_id' }
        - { $ref: '#/components/parameters/filtro_docente_id' }
      responses:
        '200': { $ref: '#/components/responses/ArchivoExportado' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '413': { $ref: '#/components/responses/Problem413' }
        '422': { $ref: '#/components/responses/Problem422' }

  /docentes/me/asignaciones:
    get:
      tags: [institucional]
      summary: Mis juegos asignados (CU-29 p2, CU-30)
      description: Lista vacía si no estás vinculado o no tenés asignaciones activas (no es error).
      operationId: verMisJuegosAsignados
      responses:
        '200':
          description: Juegos asignados con mi conteo de sesiones
          content:
            application/json:
              schema:
                type: object
                required: [juegos]
                properties:
                  juegos:
                    type: array
                    items:
                      type: object
                      required: [producto_id, nombre_producto, cantidad, asignada_en, total_sesiones, ultima_sesion_en]
                      properties:
                        producto_id: { type: string, format: uuid }
                        nombre_producto: { type: string }
                        cantidad: { type: integer }
                        asignada_en: { type: string, format: date-time }
                        total_sesiones: { type: integer }
                        ultima_sesion_en: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Problem401' }

  /docentes/me/sesiones-juego:
    post:
      tags: [institucional]
      summary: Cargar una sesión de uso de un juego (CU-29)
      operationId: cargarSesionJuego
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SesionJuegoInput' }
      responses:
        '201':
          description: Sesión registrada (respuesta en camelCase)
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Problem401' }
        '403':
          description: >
            El docente no tiene asignado ese juego (CU-29 A7.3: 403, no 404 — el juego existe,
            falta la asignación). `title: "No tenés asignado este producto"`; `detail` con el
            mensaje para el usuario de A7.4.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Entrada inválida (fecha futura, aprendizajes < 20 caracteres, etc.) o docente no vinculado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [institucional]
      summary: Historial de mis sesiones (CU-30)
      description: >
        Respuesta en camelCase. Query validada con Zod: `producto_id` uuid, `pagina` entero ≥ 1,
        `limite` entero entre 1 y 100. Fuera de rango o no numérico → 422.
      operationId: verMisSesiones
      parameters:
        - name: producto_id
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/pagina' }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de sesiones
          content:
            application/json:
              schema:
                type: object
                required: [items, totalItems, totalPaginas, paginaActual]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SesionJuegoResumen' }
                  totalItems: { type: integer }
                  totalPaginas: { type: integer }
                  paginaActual: { type: integer }
        '401': { $ref: '#/components/responses/Problem401' }
        '422':
          description: Query inválida, o el docente no está vinculado a ninguna institución
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /docentes/me/sesiones-juego/{sesion_id}:
    get:
      tags: [institucional]
      summary: Detalle de una sesión propia (CU-30 A9)
      description: Respuesta en camelCase. Un id que no es uuid responde 404.
      operationId: verDetalleSesion
      parameters:
        - name: sesion_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sesión completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionJuegoDetalle' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }

  # ───────────────────────── COMUNIDAD ─────────────────────────
  /levels:
    get:
      tags: [comunidad]
      summary: Catálogo de niveles educativos (público)
      description: Para armar selectores; los formularios mandan el `id`.
      operationId: listarNiveles
      security: []
      responses:
        '200':
          description: Niveles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemCatalogo' }

  /subjects:
    get:
      tags: [comunidad]
      summary: Catálogo de materias (público)
      operationId: listarMaterias
      security: []
      responses:
        '200':
          description: Materias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemCatalogo' }

  /polls:
    get:
      tags: [comunidad]
      summary: Listar encuestas públicas (CU-14, CU-16)
      description: >
        Nunca incluye borradores (`draft`). Nota: hoy ninguna operación lleva una encuesta a
        `closed` (ver backlog), así que `status=closed` siempre devuelve una lista vacía.
      operationId: listarEncuestas
      security: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, closed] }
        - name: level_id
          in: query
          description: Filtro por nivel educativo (id de GET /levels)
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Encuestas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, pregunta, estado, nivel_educativo_id, total_votos, creada_en]
                  properties:
                    id: { type: string, format: uuid }
                    pregunta: { type: string }
                    estado: { type: string, enum: [active, closed] }
                    nivel_educativo_id: { type: [string, 'null'], format: uuid }
                    total_votos: { type: integer }
                    creada_en: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Problem422' }

  /polls/{poll_id}/results:
    get:
      tags: [comunidad]
      summary: Ver resultados de una encuesta (CU-16)
      description: >
        Sesión opcional: con sesión, `ya_voto` y `opcion_votada_id` reflejan el voto propio.
        Votos contados en el momento (sin columna de conteo).
      operationId: verResultadosEncuesta
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/poll_id' }
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadosEncuesta' }
        '404':
          description: No existe o es un borrador
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /polls/{poll_id}/responses:
    post:
      tags: [comunidad]
      summary: Votar en una encuesta (CU-14)
      description: >
        Requiere sesión (RN-006). Un solo voto por usuario y encuesta (UNIQUE poll_id+user_id).
        Devuelve los resultados actualizados. Responde 201 (default de NestJS para POST).
      operationId: votarEncuesta
      parameters:
        - { $ref: '#/components/parameters/poll_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opcion_id]
              properties:
                opcion_id: { type: string, format: uuid }
      responses:
        '201':
          description: Voto registrado; resultados actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadosEncuesta' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404':
          description: La encuesta no existe o no está activa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Ya votaste en esta encuesta
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: La opción no pertenece a la encuesta, o entrada inválida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /proposals:
    get:
      tags: [comunidad]
      summary: Mis propuestas enviadas (CU-15)
      operationId: verMisPropuestas
      responses:
        '200':
          description: Propuestas del usuario con su estado de moderación
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, titulo, estado, creada_en, actualizada_en]
                  properties:
                    id: { type: string, format: uuid }
                    titulo: { type: string }
                    estado: { $ref: '#/components/schemas/EstadoPropuesta' }
                    creada_en: { type: string, format: date-time }
                    actualizada_en: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem401' }
    post:
      tags: [comunidad]
      summary: Enviar propuesta de juego (CU-15)
      description: >
        Notifica a TODOS los usuarios admin (tablero + email por outbox, RN-005). Duplicado
        (A3/D-51): mismo usuario y mismo título exacto dentro de las últimas 24 h → 409.
      operationId: enviarPropuesta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, descripcion]
              properties:
                titulo: { type: string, minLength: 1 }
                descripcion: { type: string, minLength: 50 }
                materia_id: { type: [string, 'null'], format: uuid, description: Id de GET /subjects }
                nivel_educativo_id: { type: [string, 'null'], format: uuid, description: Id de GET /levels }
      responses:
        '201':
          description: Propuesta enviada (estado `pending`)
          content:
            application/json:
              schema:
                type: object
                required: [id, titulo, descripcion, materia_id, nivel_educativo_id, estado, creada_en]
                properties:
                  id: { type: string, format: uuid }
                  titulo: { type: string }
                  descripcion: { type: string }
                  materia_id: { type: [string, 'null'], format: uuid }
                  nivel_educativo_id: { type: [string, 'null'], format: uuid }
                  estado: { $ref: '#/components/schemas/EstadoPropuesta' }
                  creada_en: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem401' }
        '409':
          description: Propuesta duplicada (mismo título en 24 h)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Entrada inválida, o materia/nivel inexistentes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/polls:
    get:
      tags: [comunidad]
      summary: Listar encuestas, incluidos borradores (CU-20)
      operationId: listarEncuestasAdmin
      responses:
        '200':
          description: Encuestas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, pregunta, estado, nivel_educativo_id, creada_en, total_votos]
                  properties:
                    id: { type: string, format: uuid }
                    pregunta: { type: string }
                    estado: { $ref: '#/components/schemas/EstadoEncuesta' }
                    nivel_educativo_id: { type: [string, 'null'], format: uuid }
                    creada_en: { type: string, format: date-time }
                    total_votos: { type: integer }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      tags: [comunidad]
      summary: Crear encuesta (CU-20)
      description: Se crea en `draft` (RN-004); se publica con el toggle.
      operationId: crearEncuesta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncuestaInput' }
      responses:
        '201':
          description: Encuesta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncuestaAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422':
          description: Entrada inválida (2-10 opciones, sin vacías ni duplicadas) o nivel inexistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/polls/{poll_id}:
    get:
      tags: [comunidad]
      summary: Ver encuesta con sus opciones, para precargar la edición (CU-20 A2)
      operationId: verEncuestaAdmin
      parameters:
        - { $ref: '#/components/parameters/poll_id' }
      responses:
        '200':
          description: Encuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncuestaAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    put:
      tags: [comunidad]
      summary: Editar encuesta (CU-20 A2)
      description: Reemplaza pregunta, nivel y opciones. Una encuesta `active` no se puede editar (409).
      operationId: actualizarEncuesta
      parameters:
        - { $ref: '#/components/parameters/poll_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncuestaInput' }
      responses:
        '200':
          description: Encuesta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncuestaAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409':
          description: La encuesta está activa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }
    delete:
      tags: [comunidad]
      summary: Eliminar encuesta, baja FÍSICA con sus opciones y votos (CU-20)
      operationId: eliminarEncuesta
      parameters:
        - { $ref: '#/components/parameters/poll_id' }
      responses:
        '204': { description: Eliminada }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  /admin/polls/{poll_id}/toggle:
    patch:
      tags: [comunidad]
      summary: Activar o desactivar encuesta (CU-20)
      description: Solo alterna `draft` ↔ `active`. No existe transición hacia ni desde `closed`.
      operationId: alternarEstadoEncuesta
      parameters:
        - { $ref: '#/components/parameters/poll_id' }
      responses:
        '200':
          description: Encuesta con el estado nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncuestaAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  /admin/proposals:
    get:
      tags: [comunidad]
      summary: Listar propuestas recibidas (CU-21)
      operationId: listarPropuestasAdmin
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EstadoPropuesta' }
        - name: search
          in: query
          description: Búsqueda por título
          schema: { type: string, minLength: 1 }
        - name: order
          in: query
          description: Por fecha de creación
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Propuestas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, titulo, autor, estado, creada_en]
                  properties:
                    id: { type: string, format: uuid }
                    titulo: { type: string }
                    autor: { type: string, description: Nombre del docente }
                    estado: { $ref: '#/components/schemas/EstadoPropuesta' }
                    creada_en: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }

  /admin/proposals/{proposal_id}:
    get:
      tags: [comunidad]
      summary: Ver propuesta completa (CU-21)
      operationId: verPropuestaAdmin
      parameters:
        - { $ref: '#/components/parameters/proposal_id' }
      responses:
        '200':
          description: Propuesta con su autor
          content:
            application/json:
              schema:
                type: object
                required: [id, titulo, descripcion, autor, materia_id, nivel_educativo_id, estado, feedback_admin, creada_en, actualizada_en]
                properties:
                  id: { type: string, format: uuid }
                  titulo: { type: string }
                  descripcion: { type: string }
                  autor:
                    type: object
                    required: [id, nombre, email]
                    properties:
                      id: { type: string, format: uuid }
                      nombre: { type: string }
                      email: { type: string, format: email }
                  materia_id: { type: [string, 'null'], format: uuid }
                  nivel_educativo_id: { type: [string, 'null'], format: uuid }
                  estado: { $ref: '#/components/schemas/EstadoPropuesta' }
                  feedback_admin: { type: [string, 'null'] }
                  creada_en: { type: string, format: date-time }
                  actualizada_en: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    put:
      tags: [comunidad]
      summary: Revisar propuesta, cambia estado y feedback (CU-21)
      description: >
        Notifica al autor (tablero + email). 409 si se intenta volver a `pending` una propuesta
        aprobada/rechazada (RN-008), o si no cambia NI el estado NI el feedback.
      operationId: revisarPropuesta
      parameters:
        - { $ref: '#/components/parameters/proposal_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoPropuesta' }
                feedback: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Propuesta revisada
          content:
            application/json:
              schema:
                type: object
                required: [id, titulo, estado, feedback_admin, actualizada_en]
                properties:
                  id: { type: string, format: uuid }
                  titulo: { type: string }
                  estado: { $ref: '#/components/schemas/EstadoPropuesta' }
                  feedback_admin: { type: [string, 'null'] }
                  actualizada_en: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409':
          description: Transición inválida o revisión sin cambios
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }

  # ───────────────────────── ADMIN · CATÁLOGO (CU-19, CU-22) ─────────────────────────
  /admin/products:
    get:
      tags: [admin-catalogo]
      summary: Listar productos, incluidos los inactivos (CU-19 p4)
      operationId: listarProductosAdmin
      parameters:
        - { name: q, in: query, description: Búsqueda por título, schema: { type: string, minLength: 1 } }
        - { $ref: '#/components/parameters/pagina' }
        - name: tamanio
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/ProductoAdminFila' }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
    post:
      tags: [admin-catalogo]
      summary: Crear producto (CU-19 p6)
      operationId: crearProducto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoAdminInput' }
      responses:
        '201':
          description: Producto creado (activo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422':
          description: Entrada inválida (incluye reglas cruzadas RN-003/004/005) o categoría inexistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/products/imagen:
    post:
      tags: [admin-catalogo]
      summary: Subir imagen de producto (CU-19)
      description: >
        Se sube ANTES de guardar el formulario; la URL pública devuelta se usa como
        `imagen_url` del producto. PNG, JPEG o WEBP, hasta 5 MB.
      operationId: subirImagenProducto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: Imagen subida al bucket público de productos
          content:
            application/json:
              schema:
                type: object
                required: [imagen_url]
                properties:
                  imagen_url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '413': { $ref: '#/components/responses/Problem413' }
        '422':
          description: Tipo de archivo no permitido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/products/{product_id}:
    get:
      tags: [admin-catalogo]
      summary: Ver producto completo, para precargar la edición (CU-19 A1)
      operationId: verProductoAdmin
      parameters:
        - { $ref: '#/components/parameters/product_id' }
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    put:
      tags: [admin-catalogo]
      summary: Editar producto, incluido el descuento mayorista (CU-19 A1, CU-22)
      description: >
        Reemplazo completo: se reenvía el formulario entero (mismo schema que el alta). No
        cambia `activo` (para eso, DELETE / reactivar). Las órdenes existentes no se ven
        afectadas: guardan un snapshot del precio y del descuento (CU-22 RN-007).
      operationId: actualizarProducto
      parameters:
        - { $ref: '#/components/parameters/product_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoAdminInput' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
    delete:
      tags: [admin-catalogo]
      summary: Desactivar producto, baja LÓGICA (CU-19 A2, RNF-008)
      description: >
        No borra: pone `activo = false` y lo saca del catálogo público. Responde 200 con el
        producto (a diferencia de categorías y recursos, cuya baja física responde 204).
      operationId: desactivarProducto
      parameters:
        - { $ref: '#/components/parameters/product_id' }
      responses:
        '200':
          description: Producto desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  /admin/products/{product_id}/reactivar:
    post:
      tags: [admin-catalogo]
      summary: Reactivar un producto desactivado
      description: Inverso de DELETE. Responde 201 (default de NestJS para POST) aunque no crea nada.
      operationId: reactivarProducto
      parameters:
        - { $ref: '#/components/parameters/product_id' }
      responses:
        '201':
          description: Producto reactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  /admin/products/{product_id}/demo:
    get:
      tags: [admin-catalogo]
      summary: Ver la demo del producto, para precargar la edición (CU-19 A8)
      description: Si el producto no tiene demo responde 200 con `asignada = false` (no 404).
      operationId: verDemoAdmin
      parameters:
        - { $ref: '#/components/parameters/product_id' }
      responses:
        '200':
          description: Demo (o su ausencia)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoAdminVista' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404':
          description: El producto no existe
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [admin-catalogo]
      summary: Asignar o reemplazar la demo del producto, upsert (CU-19 A8)
      description: >
        Un producto tiene como máximo UNA demo (UNIQUE product_id). Del JSON libre, el
        catálogo público solo usa `tipo`, `formato` y `contenido_ref`. `url_unity_webgl` se
        guarda dentro del JSON como `unity_webgl_url`. No hay endpoint para borrar la demo.
      operationId: asignarDemo
      parameters:
        - { $ref: '#/components/parameters/product_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuracion_json]
              properties:
                configuracion_json: { $ref: '#/components/schemas/ConfiguracionDemo' }
                url_unity_webgl: { type: [string, 'null'], format: uri }
      responses:
        '200':
          description: Demo guardada
          content:
            application/json:
              schema:
                type: object
                required: [id, producto_id, configuracion_json]
                properties:
                  id: { type: string, format: uuid }
                  producto_id: { type: string, format: uuid }
                  configuracion_json: { $ref: '#/components/schemas/ConfiguracionDemo' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }

  /admin/categories:
    get:
      tags: [admin-catalogo]
      summary: Listar categorías (CU-19 A7)
      operationId: listarCategoriasAdmin
      responses:
        '200':
          description: Todas las categorías
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      tags: [admin-catalogo]
      summary: Crear categoría (CU-19 A7)
      operationId: crearCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409':
          description: Ya existe una categoría con ese nombre
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }

  /admin/categories/{category_id}:
    put:
      tags: [admin-catalogo]
      summary: Renombrar categoría (CU-19 A7)
      operationId: actualizarCategoria
      parameters:
        - { $ref: '#/components/parameters/category_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409':
          description: Ya existe una categoría con ese nombre
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem422' }
    delete:
      tags: [admin-catalogo]
      summary: Eliminar categoría, baja FÍSICA (CU-19 A7)
      description: Los productos que la usaban quedan con `categoria_id = null` (no bloquea).
      operationId: eliminarCategoria
      parameters:
        - { $ref: '#/components/parameters/category_id' }
      responses:
        '204': { description: Eliminada }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  /admin/resources:
    get:
      tags: [admin-catalogo]
      summary: Listar recursos (CU-19 A9)
      operationId: listarRecursosAdmin
      responses:
        '200':
          description: Todos los recursos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecursoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      tags: [admin-catalogo]
      summary: Crear recurso (CU-19 A9)
      description: >
        `producto_id` es opcional (D-19). Ojo: un recurso `licenciado` SIN producto nunca puede
        descargarse (no hay contra qué verificar compra ni asignación).
      operationId: crearRecurso
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecursoAdminInput' }
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecursoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422':
          description: Entrada inválida o producto relacionado inexistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/resources/pdf:
    post:
      tags: [admin-catalogo]
      summary: Subir PDF de recurso (CU-19 A9)
      description: >
        Se sube ANTES de guardar el formulario al bucket PRIVADO `recursos`; el path devuelto
        se usa como `url` del recurso (tipo `pdf`). Solo PDF, hasta 20 MB. La descarga luego
        se sirve con URL firmada (CU-08/09).
      operationId: subirPdfRecurso
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: PDF subido
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, description: Path dentro del bucket privado (no es una URL pública) }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '413': { $ref: '#/components/responses/Problem413' }
        '422':
          description: El archivo no es un PDF
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/resources/{resource_id}:
    put:
      tags: [admin-catalogo]
      summary: Editar recurso (CU-19 A9)
      operationId: actualizarRecurso
      parameters:
        - { $ref: '#/components/parameters/resource_id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecursoAdminInput' }
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecursoAdmin' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
    delete:
      tags: [admin-catalogo]
      summary: Eliminar recurso, baja FÍSICA (CU-19 A9)
      operationId: eliminarRecurso
      parameters:
        - { $ref: '#/components/parameters/resource_id' }
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: acalud_sesion
      description: Token opaco de sesión (web). httpOnly, Secure, SameSite=Lax.
    bearerAuth:
      type: http
      scheme: bearer
      description: El mismo token opaco, enviado por la APK (Capacitor).

  parameters:
    pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    juego_id:
      name: juego_id
      in: path
      required: true
      description: Id del producto. Un formato que no es uuid responde 404 (no 422).
      schema: { type: string, format: uuid }
    recurso_id:
      name: recurso_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    partner_id:
      name: partner_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    contexto:
      name: contexto
      in: query
      description: institution_id para el carrito institucional (CU-24). Ausente = personal.
      schema: { type: string, format: uuid }
    pedido_id:
      name: pedido_id
      in: path
      required: true
      description: >
        Sin validación de formato en el controller: un valor que no es uuid probablemente
        termina en 500 (ver backlog).
      schema: { type: string, format: uuid }
    poll_id:
      name: poll_id
      in: path
      required: true
      description: Un formato que no es uuid responde 404.
      schema: { type: string, format: uuid }
    proposal_id:
      name: proposal_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    institucion_id:
      name: institucion_id
      in: path
      required: true
      description: Un formato que no es uuid responde 404.
      schema: { type: string, format: uuid }
    producto_id:
      name: producto_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    docente_id:
      name: docente_id
      in: path
      required: true
      description: Id de la membresía (institutional_teachers), no del usuario.
      schema: { type: string, format: uuid }
    direccion:
      name: direccion
      in: query
      schema: { type: string, enum: [asc, desc] }
    desde:
      name: desde
      in: query
      description: Fecha (ISO 8601), inclusive
      schema: { type: string, format: date }
    hasta:
      name: hasta
      in: query
      schema: { type: string, format: date }
    filtro_producto_id:
      name: producto_id
      in: query
      schema: { type: string, format: uuid }
    filtro_docente_id:
      name: docente_id
      in: query
      schema: { type: string, format: uuid }
    formato_export:
      name: formato
      in: query
      schema: { type: string, enum: [excel, pdf], default: excel }
    product_id:
      name: product_id
      in: path
      required: true
      description: Un formato que no es uuid responde 404.
      schema: { type: string, format: uuid }
    category_id:
      name: category_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    resource_id:
      name: resource_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    SetCookieSesion:
      description: >
        `acalud_sesion=<token>; HttpOnly; SameSite=Lax; Path=/; Max-Age=604800`
        (+ `Secure` en producción).
      schema: { type: string }

  responses:
    ArchivoExportado:
      description: Archivo para descargar (`Content-Disposition` attachment con nombre fechado)
      headers:
        Content-Disposition:
          schema: { type: string, examples: ['attachment; filename="Reporte_Institucional_X_2026-11-16.xlsx"'] }
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
        application/pdf:
          schema: { type: string, format: binary }
    Problem400:
      description: Falta un dato estructural (ej. el archivo en una subida multipart)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem413:
      description: Archivo más grande que el límite (lo corta multer antes del caso de uso)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem401:
      description: No autenticado (sin sesión o sesión vencida)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem403:
      description: Autenticado pero sin el rol requerido (solo rutas /admin)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem404:
      description: No existe o no es tuyo (autorización por propiedad, IDOR-safe)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem410:
      description: Enlace/token inválido, vencido o ya usado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem422:
      description: Entrada inválida (Zod) o regla de negocio incumplida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem503:
      description: Proveedor externo no disponible (pago, envíos)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details (platform/http/problem-details.filter.ts)
      required: [type, title, status, instance, trace_id]
      properties:
        type: { type: string, examples: ['about:blank'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: URL original del request }
        trace_id: { type: string, format: uuid }

    Mensaje:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string, description: Texto listo para mostrar al usuario }

    TokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, description: Token opaco recibido por email }

    RegistroInput:
      type: object
      required: [email, contrasena, nombre, apellido]
      properties:
        email: { type: string, format: email }
        contrasena: { type: string, minLength: 12, maxLength: 128, description: 'PA-01: sin reglas de composición' }
        nombre: { type: string, minLength: 1 }
        apellido: { type: string, minLength: 1 }

    EstadoCuenta:
      type: string
      enum: [no_verificada, verificada]

    Cuenta:
      type: object
      description: Identidad mínima de la cuenta
      required: [id, email, nombre, apellido, estado, es_admin]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
        apellido: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCuenta' }
        es_admin: { type: boolean, description: Rol global de plataforma (no el encargado institucional) }

    SesionIniciada:
      type: object
      required: [token, cuenta, capacidades_limitadas]
      properties:
        token: { type: string, description: Token opaco; la APK lo envía como Bearer. La web usa la cookie. }
        cuenta: { $ref: '#/components/schemas/Cuenta' }
        capacidades_limitadas: { type: boolean, description: true mientras el email no esté verificado }

    PerfilPropio:
      allOf:
        - $ref: '#/components/schemas/Cuenta'
        - type: object
          required: [capacidades_limitadas, nivel_educativo, materia, institucion]
          properties:
            capacidades_limitadas: { type: boolean }
            nivel_educativo: { type: [string, 'null'] }
            materia: { type: [string, 'null'] }
            institucion: { type: [string, 'null'], description: 'Nombre de escuela de texto libre (no la institución registrada; esa se consulta en GET /instituciones/mine)' }

    PerfilInput:
      type: object
      required: [nombre, apellido]
      properties:
        nombre: { type: string, minLength: 1 }
        apellido: { type: string, minLength: 1 }
        nivel_educativo: { type: [string, 'null'], description: 'Nombre de un nivel de GET /levels (ej. Primaria)' }
        materia: { type: [string, 'null'], description: 'Nombre de una materia de GET /subjects' }
        institucion: { type: [string, 'null'] }

    Paginacion:
      type: object
      required: [pagina, tamanio, total]
      properties:
        pagina: { type: integer }
        tamanio: { type: integer }
        total: { type: integer, description: Total de elementos (no de páginas) }

    JuegoResumen:
      type: object
      required: [id, nombre, precio_lista, area, imagen_url, tiene_demo_publica]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        precio_lista: { type: number, description: ARS }
        area: { type: [string, 'null'] }
        imagen_url: { type: [string, 'null'] }
        tiene_demo_publica: { type: boolean }

    ListadoJuegos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/JuegoResumen' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    JuegoDetalle:
      allOf:
        - $ref: '#/components/schemas/JuegoResumen'
        - type: object
          required: [descripcion, peso_gramos, stock_disponible, imagenes, demos, recursos, tramos]
          properties:
            descripcion: { type: string }
            peso_gramos: { type: [integer, 'null'] }
            stock_disponible: { type: boolean }
            imagenes:
              type: array
              items: { type: string }
            demos:
              type: array
              items:
                type: object
                required: [tipo, formato]
                properties:
                  tipo: { type: string, enum: [publica, completa] }
                  formato: { type: string, enum: [html5, pdf, video] }
            recursos:
              type: array
              items:
                type: object
                required: [id, nombre, tipo, desbloqueado]
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  tipo: { type: string, enum: [libre, licenciado] }
                  desbloqueado:
                    type: boolean
                    description: Libre → true. Licenciado → true solo si el usuario autenticado tiene derecho al juego.
            tramos:
              type: array
              description: Descuentos por cantidad (CU-22)
              items:
                type: object
                required: [cantidad_minima, descuento_pct]
                properties:
                  cantidad_minima: { type: integer }
                  descuento_pct: { type: number }

    ContenidoDemo:
      type: object
      description: >
        OJO: en camelCase, a diferencia del resto de la API (snake_case). Se documenta tal
        cual; unificar es parte de la Fase 2.
      required: [juegoId, demoId, tipo, formato, urlEmbebido]
      properties:
        juegoId: { type: string, format: uuid }
        demoId: { type: string, format: uuid }
        tipo: { type: string, enum: [publica, completa] }
        formato: { type: string, enum: [html5, pdf, video] }
        urlEmbebido: { type: string, description: URL para iframe/video }

    EnlaceDescarga:
      type: object
      required: [url_firmada]
      properties:
        url_firmada: { type: string, description: URL firmada (PDF) o URL externa (enlace) }
        expira_en: { type: string, format: date-time, description: Solo para PDF (5 minutos) }

    EditorialResumen:
      type: object
      required: [id, nombre, logo_url, descripcion, sitio_web]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        logo_url: { type: [string, 'null'] }
        descripcion: { type: [string, 'null'] }
        sitio_web: { type: [string, 'null'] }

    EditorialDetalle:
      allOf:
        - $ref: '#/components/schemas/EditorialResumen'
        - type: object
          required: [categoria]
          properties:
            categoria: { type: [string, 'null'] }

    FavoritoInput:
      type: object
      description: Exactamente uno de los tres no nulo (Zod .refine + CHECK en la base)
      properties:
        producto_id: { type: [string, 'null'], format: uuid }
        recurso_id: { type: [string, 'null'], format: uuid }
        editorial_id: { type: [string, 'null'], format: uuid }

    Favorito:
      type: object
      required: [id, producto_id, recurso_id, editorial_id, creado_en]
      properties:
        id: { type: string, format: uuid }
        producto_id: { type: [string, 'null'], format: uuid }
        recurso_id: { type: [string, 'null'], format: uuid }
        editorial_id: { type: [string, 'null'], format: uuid }
        creado_en: { type: string, format: date-time }

    FavoritoResumen:
      type: object
      required: [id, tipo, item_id, titulo, creado_en]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [product, resource, editorial_partner] }
        item_id: { type: string, format: uuid }
        titulo: { type: string }
        creado_en: { type: string, format: date-time }

    ModalidadEnvio:
      type: string
      enum: [home_delivery, branch_pickup]

    EstadoPedido:
      type: string
      enum: [pending, paid, shipped, delivered, cancelled, under_review]

    CarritoView:
      type: object
      required: [lineas, total, ahorro_total, contexto]
      properties:
        lineas:
          type: array
          items:
            type: object
            required: [juego_id, nombre, cantidad, precio_lista, descuento_pct, precio_unitario, subtotal, disponible]
            properties:
              juego_id: { type: string, format: uuid }
              nombre: { type: string }
              cantidad: { type: integer }
              precio_lista: { type: number }
              descuento_pct: { type: number }
              precio_unitario: { type: number, description: precio_lista con el descuento por cantidad aplicado }
              subtotal: { type: number }
              disponible: { type: boolean, description: false si no hay stock suficiente }
        total: { type: number, description: Sin envío }
        ahorro_total: { type: number }
        contexto: { type: [string, 'null'], format: uuid }

    OpcionEnvio:
      type: object
      required: [modalidad, nombre_servicio, costo, plazo_estimado_dias, tracking_disponible]
      properties:
        modalidad: { $ref: '#/components/schemas/ModalidadEnvio' }
        nombre_servicio: { type: string }
        costo: { type: number }
        plazo_estimado_dias: { type: integer }
        tracking_disponible: { type: boolean, description: Solo con MiCorreo }

    OrdenHistorial:
      type: object
      required: [id, numero, fecha, total, estado, tracking_code, order_type, institution_id]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        fecha: { type: string, format: date-time }
        total: { type: number }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        tracking_code: { type: [string, 'null'] }
        order_type: { type: string, enum: [b2c, b2b] }
        institution_id: { type: [string, 'null'], format: uuid }

    DetallePedido:
      type: object
      required: [id, numero, fecha, estado, subtotal, envio_costo, total, tracking_code, order_type, institution_id, billing_data, domicilio, lineas]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        fecha: { type: string, format: date-time }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        subtotal: { type: number }
        envio_costo: { type: number }
        total: { type: number }
        tracking_code: { type: [string, 'null'] }
        order_type: { type: string, enum: [b2c, b2b] }
        institution_id: { type: [string, 'null'], format: uuid }
        billing_data:
          description: Solo en B2B (CU-24 RN-007); armado en el servidor desde la institución
          oneOf:
            - type: 'null'
            - type: object
              required: [razon_social, cuit]
              properties:
                razon_social: { type: string }
                cuit: { type: string }
        domicilio:
          type: object
          properties:
            calle: { type: [string, 'null'] }
            numero: { type: [string, 'null'] }
            localidad: { type: [string, 'null'] }
            provincia: { type: [string, 'null'] }
            codigo_postal: { type: [string, 'null'] }
        lineas:
          type: array
          items:
            type: object
            required: [juego_id, nombre, cantidad, precio_unitario, descuento_pct]
            properties:
              juego_id: { type: string, format: uuid }
              nombre: { type: string, description: Snapshot del nombre al comprar }
              cantidad: { type: integer }
              precio_unitario: { type: number, description: Snapshot del precio al comprar }
              descuento_pct: { type: number }

    SeguimientoPedido:
      type: object
      required: [estado_actual, eventos, fecha_estimada_entrega, direccion_entrega, ultima_actualizacion, desde_cache]
      properties:
        estado_actual: { type: string }
        eventos:
          type: array
          items:
            type: object
            required: [estado, ubicacion, descripcion, fecha]
            properties:
              estado: { type: string }
              ubicacion: { type: [string, 'null'] }
              descripcion: { type: string }
              fecha: { type: [string, 'null'], format: date-time }
        fecha_estimada_entrega: { type: [string, 'null'], description: Solo en respuesta fresca }
        direccion_entrega: { type: [string, 'null'], description: Solo en respuesta fresca }
        ultima_actualizacion: { type: [string, 'null'], format: date-time }
        desde_cache: { type: boolean }

    ItemCatalogo:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    EstadoEncuesta:
      type: string
      enum: [draft, active, closed]
      description: '`closed` existe en la base pero hoy ninguna operación la alcanza'

    EstadoPropuesta:
      type: string
      enum: [pending, reviewed, approved, rejected]

    ResultadosEncuesta:
      type: object
      required: [poll_id, pregunta, estado, total_votos, opciones, ya_voto, opcion_votada_id]
      properties:
        poll_id: { type: string, format: uuid }
        pregunta: { type: string }
        estado: { type: string, enum: [active, closed] }
        total_votos: { type: integer }
        opciones:
          type: array
          items:
            type: object
            required: [id, texto, votos, porcentaje]
            properties:
              id: { type: string, format: uuid }
              texto: { type: string }
              votos: { type: integer }
              porcentaje: { type: number }
        ya_voto: { type: boolean, description: Siempre false sin sesión }
        opcion_votada_id: { type: [string, 'null'], format: uuid }

    EncuestaInput:
      type: object
      required: [pregunta, opciones]
      properties:
        pregunta: { type: string, minLength: 1 }
        nivel_educativo_id: { type: [string, 'null'], format: uuid, description: Id de GET /levels }
        opciones:
          type: array
          minItems: 2
          maxItems: 10
          description: Sin textos vacíos ni duplicados (sin distinguir mayúsculas)
          items: { type: string, minLength: 1 }

    EncuestaAdmin:
      type: object
      required: [id, pregunta, estado, nivel_educativo_id, creada_en, opciones]
      properties:
        id: { type: string, format: uuid }
        pregunta: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEncuesta' }
        nivel_educativo_id: { type: [string, 'null'], format: uuid }
        creada_en: { type: string, format: date-time }
        opciones:
          type: array
          items:
            type: object
            required: [id, texto]
            properties:
              id: { type: string, format: uuid }
              texto: { type: string }

    Domicilio:
      type: object
      required: [calle, numero, localidad, provincia, codigo_postal]
      properties:
        calle: { type: string, minLength: 1 }
        numero: { type: string, minLength: 1 }
        localidad: { type: string, minLength: 1 }
        provincia: { type: string, minLength: 1 }
        codigo_postal: { type: string, minLength: 1 }

    MiInstitucion:
      type: object
      required: [institucion_id, es_encargado, datos_facturacion_envio]
      properties:
        institucion_id: { type: [string, 'null'], format: uuid }
        es_encargado: { type: boolean }
        datos_facturacion_envio:
          oneOf:
            - type: 'null'
            - type: object
              required: [nombre_legal, identificador_tributario, domicilio]
              properties:
                nombre_legal: { type: string }
                identificador_tributario: { type: string }
                domicilio:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/Domicilio'

    InstitucionInput:
      type: object
      required: [nombre_legal, identificador_tributario, email_institucional, domicilio]
      properties:
        nombre_legal: { type: string, minLength: 1, maxLength: 200 }
        identificador_tributario: { type: string, description: 'CUIT: 11 dígitos, con o sin guiones' }
        email_institucional: { type: string, format: email, maxLength: 255 }
        domicilio: { $ref: '#/components/schemas/Domicilio' }
        telefono: { type: [string, 'null'], maxLength: 30 }
        nivel_educativo: { type: [string, 'null'], maxLength: 100, description: 'Nombre del nivel (ej. Primaria)' }
        cantidad_alumnos: { type: [integer, 'null'], minimum: 1 }

    InventarioInstitucional:
      type: object
      required: [institucion_id, resumen, items]
      properties:
        institucion_id: { type: string, format: uuid }
        resumen:
          type: object
          required: [total_adquiridas, docentes_asignados, total_en_uso, total_disponibles]
          properties:
            total_adquiridas: { type: integer }
            docentes_asignados: { type: integer }
            total_en_uso: { type: integer }
            total_disponibles: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [producto_id, nombre_producto, descripcion_producto, cantidad_adquirida, cantidad_asignada, cantidad_disponible, ultima_compra_en, total_gastado]
            properties:
              producto_id: { type: string, format: uuid }
              nombre_producto: { type: string }
              descripcion_producto: { type: [string, 'null'] }
              cantidad_adquirida: { type: integer }
              cantidad_asignada: { type: integer }
              cantidad_disponible: { type: integer }
              ultima_compra_en: { type: [string, 'null'], format: date-time }
              total_gastado: { type: [number, 'null'], description: null si nunca se compró }

    DetalleProductoInventario:
      type: object
      required: [producto_id, nombre_producto, descripcion_producto, precio, cantidad_adquirida, cantidad_asignada, cantidad_disponible, compras, docentes]
      properties:
        producto_id: { type: string, format: uuid }
        nombre_producto: { type: string }
        descripcion_producto: { type: [string, 'null'] }
        precio: { type: number }
        cantidad_adquirida: { type: integer }
        cantidad_asignada: { type: integer }
        cantidad_disponible: { type: integer }
        compras:
          type: array
          items:
            type: object
            required: [orden_id, numero, fecha, cantidad, monto]
            properties:
              orden_id: { type: string, format: uuid }
              numero: { type: string }
              fecha: { type: string, format: date-time }
              cantidad: { type: integer }
              monto: { type: number }
        docentes:
          type: array
          items:
            type: object
            required: [docente_id, nombre, cantidad, asignada_en, estado]
            properties:
              docente_id: { type: string, format: uuid }
              nombre: { type: string }
              cantidad: { type: integer }
              asignada_en: { type: string, format: date-time }
              estado: { type: string, enum: [active, revoked] }

    AsignacionDeDocente:
      type: object
      required: [producto_id, nombre_producto, cantidad, asignada_en, asignada_por, estado]
      properties:
        producto_id: { type: string, format: uuid }
        nombre_producto: { type: string }
        cantidad: { type: integer }
        asignada_en: { type: string, format: date-time }
        asignada_por: { type: [string, 'null'] }
        estado: { type: string, enum: [active, revoked] }

    ListadoDocentesAsignados:
      type: object
      required: [institucion_id, resumen, docentes]
      properties:
        institucion_id: { type: string, format: uuid }
        resumen:
          type: object
          required: [total_docentes_con_asignaciones, total_licencias_asignadas, productos_mas_asignados]
          properties:
            total_docentes_con_asignaciones: { type: integer }
            total_licencias_asignadas: { type: integer }
            productos_mas_asignados:
              type: array
              items:
                type: object
                required: [producto_id, nombre_producto, total]
                properties:
                  producto_id: { type: string, format: uuid }
                  nombre_producto: { type: string }
                  total: { type: integer }
        docentes:
          type: array
          items:
            type: object
            required: [docente_id, nombre, email, total_licencias, ultima_asignacion_en, asignaciones]
            properties:
              docente_id: { type: string, format: uuid }
              nombre: { type: string }
              email: { type: string, format: email }
              total_licencias: { type: integer }
              ultima_asignacion_en: { type: [string, 'null'], format: date-time }
              asignaciones:
                type: array
                items: { $ref: '#/components/schemas/AsignacionDeDocente' }

    DetalleDocenteAsignaciones:
      type: object
      required: [docente_id, nombre, email, vinculado_en, asignaciones]
      properties:
        docente_id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        vinculado_en: { type: [string, 'null'], format: date-time }
        asignaciones:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AsignacionDeDocente'
              - type: object
                required: [revocada_en, revocada_por, razon_revocacion]
                properties:
                  revocada_en: { type: [string, 'null'], format: date-time }
                  revocada_por: { type: [string, 'null'] }
                  razon_revocacion: { type: [string, 'null'] }

    FilaReporteJuego:
      type: object
      required: [producto_id, nombre_producto, total_sesiones, docentes_distintos, alumnos_alcanzados, minutos_totales, ultima_sesion, satisfaccion_promedio, tasa_reutilizacion]
      properties:
        producto_id: { type: string, format: uuid }
        nombre_producto: { type: string }
        total_sesiones: { type: integer }
        docentes_distintos: { type: integer }
        alumnos_alcanzados: { type: integer }
        minutos_totales: { type: integer }
        ultima_sesion: { type: [string, 'null'] }
        satisfaccion_promedio: { type: number }
        tasa_reutilizacion: { type: number, description: '% de sesiones con "lo volvería a usar" (0-100)' }

    FilaReporteDocente:
      type: object
      required: [docente_id, nombre_docente, total_sesiones, juegos_distintos, alumnos_alcanzados, minutos_totales, satisfaccion_promedio, tasa_reutilizacion]
      properties:
        docente_id: { type: string, format: uuid }
        nombre_docente: { type: string }
        total_sesiones: { type: integer }
        juegos_distintos: { type: integer }
        alumnos_alcanzados: { type: integer }
        minutos_totales: { type: integer }
        satisfaccion_promedio: { type: number }
        tasa_reutilizacion: { type: number }

    PalabraFrecuente:
      type: object
      required: [palabra, frecuencia]
      properties:
        palabra: { type: string }
        frecuencia: { type: integer }

    DistribucionSatisfaccion:
      type: array
      items:
        type: object
        required: [estrellas, cantidad]
        properties:
          estrellas: { type: integer, minimum: 1, maximum: 5 }
          cantidad: { type: integer }

    ReporteInstitucional:
      type: object
      required: [institucion_id, corte, filtros, datos, kpis, serie_temporal, nube_palabras]
      properties:
        institucion_id: { type: string, format: uuid }
        corte: { type: string, enum: [juego, docente] }
        filtros:
          type: object
          properties:
            desde: { type: string }
            hasta: { type: string }
            producto_id: { type: string, format: uuid }
            docente_id: { type: string, format: uuid }
        datos:
          description: Filas por juego o por docente según `corte`
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/FilaReporteJuego' }
            - type: array
              items: { $ref: '#/components/schemas/FilaReporteDocente' }
        kpis:
          type: object
          required: [total_sesiones, alumnos_alcanzados, satisfaccion_promedio, juegos_en_uso]
          properties:
            total_sesiones: { type: integer }
            alumnos_alcanzados: { type: integer }
            satisfaccion_promedio: { type: number }
            juegos_en_uso: { type: integer }
        serie_temporal:
          type: array
          items:
            type: object
            required: [periodo, sesiones]
            properties:
              periodo: { type: string }
              sesiones: { type: integer }
        nube_palabras:
          type: array
          items: { $ref: '#/components/schemas/PalabraFrecuente' }

    DetalleReporteJuego:
      type: object
      required: [producto_id, nombre_producto, total_sesiones, alumnos_alcanzados, satisfaccion_promedio, distribucion_satisfaccion, sesiones, nube_palabras]
      properties:
        producto_id: { type: string, format: uuid }
        nombre_producto: { type: string }
        total_sesiones: { type: integer }
        alumnos_alcanzados: { type: integer }
        satisfaccion_promedio: { type: number }
        distribucion_satisfaccion: { $ref: '#/components/schemas/DistribucionSatisfaccion' }
        sesiones:
          type: array
          items:
            type: object
            required: [fecha, docente_id, nombre_docente, grupo, estudiantes, duracion_minutos, satisfaccion]
            properties:
              fecha: { type: string }
              docente_id: { type: string, format: uuid }
              nombre_docente: { type: string }
              grupo: { type: string }
              estudiantes: { type: integer }
              duracion_minutos: { type: integer }
              satisfaccion: { type: integer }
        nube_palabras:
          type: array
          items: { $ref: '#/components/schemas/PalabraFrecuente' }

    DetalleReporteDocente:
      type: object
      required: [docente_id, nombre_docente, email, total_sesiones, alumnos_alcanzados, distribucion_juegos, sesiones]
      properties:
        docente_id: { type: string, format: uuid }
        nombre_docente: { type: string }
        email: { type: string, format: email }
        total_sesiones: { type: integer }
        alumnos_alcanzados: { type: integer }
        distribucion_juegos:
          type: array
          items:
            type: object
            required: [producto_id, nombre_producto, sesiones]
            properties:
              producto_id: { type: string, format: uuid }
              nombre_producto: { type: string }
              sesiones: { type: integer }
        sesiones:
          type: array
          items:
            type: object
            required: [fecha, producto_id, nombre_producto, grupo, estudiantes, duracion_minutos, satisfaccion]
            properties:
              fecha: { type: string }
              producto_id: { type: string, format: uuid }
              nombre_producto: { type: string }
              grupo: { type: string }
              estudiantes: { type: integer }
              duracion_minutos: { type: integer }
              satisfaccion: { type: integer }

    KPI:
      type: object
      required: [valor, variacion_porcentual]
      properties:
        valor: { type: number }
        variacion_porcentual: { type: [number, 'null'], description: 'vs período anterior; null solo si ambos períodos valen 0' }

    DashboardPedagogico:
      type: object
      required: [institucion_id, rango, filtros, kpis, serie_semanal, serie_mensual, distribucion_satisfaccion, distribucion_dia_semana, top_juegos, top_docentes, nube_palabras, dificultades_frecuentes]
      properties:
        institucion_id: { type: string, format: uuid }
        rango:
          type: object
          required: [desde, hasta]
          properties:
            desde: { type: string }
            hasta: { type: string }
        filtros:
          type: object
          properties:
            producto_id: { type: string, format: uuid }
            docente_id: { type: string, format: uuid }
        kpis:
          type: object
          required: [sesiones, docentes_activos, alumnos_alcanzados, minutos_de_juego, satisfaccion_promedio, tasa_reutilizacion]
          properties:
            sesiones: { $ref: '#/components/schemas/KPI' }
            docentes_activos: { $ref: '#/components/schemas/KPI' }
            alumnos_alcanzados: { $ref: '#/components/schemas/KPI' }
            minutos_de_juego: { $ref: '#/components/schemas/KPI' }
            satisfaccion_promedio: { $ref: '#/components/schemas/KPI' }
            tasa_reutilizacion: { $ref: '#/components/schemas/KPI' }
        serie_semanal:
          type: array
          items:
            type: object
            required: [semana, sesiones]
            properties:
              semana: { type: string }
              sesiones: { type: integer }
        serie_mensual:
          type: array
          items:
            type: object
            required: [periodo, sesiones, satisfaccion_promedio]
            properties:
              periodo: { type: string }
              sesiones: { type: integer }
              satisfaccion_promedio: { type: number }
        distribucion_satisfaccion: { $ref: '#/components/schemas/DistribucionSatisfaccion' }
        distribucion_dia_semana:
          type: array
          items:
            type: object
            required: [dia_semana, sesiones]
            properties:
              dia_semana: { type: integer, minimum: 1, maximum: 7, description: ISO (1 = lunes) }
              sesiones: { type: integer }
        top_juegos:
          type: array
          items: { $ref: '#/components/schemas/FilaReporteJuego' }
        top_docentes:
          type: array
          items: { $ref: '#/components/schemas/FilaReporteDocente' }
        nube_palabras:
          type: array
          items: { $ref: '#/components/schemas/PalabraFrecuente' }
        dificultades_frecuentes:
          type: array
          items: { $ref: '#/components/schemas/PalabraFrecuente' }

    SesionJuegoInput:
      type: object
      required: [producto_id, fecha_uso, grupo, cantidad_estudiantes, duracion_minutos, satisfaccion_docente, aprendizajes_clave, reutilizaria]
      properties:
        producto_id: { type: string, format: uuid }
        fecha_uso: { type: string, format: date, description: No puede ser futura (RN-002) }
        grupo: { type: string, minLength: 1 }
        cantidad_estudiantes: { type: integer, minimum: 1 }
        duracion_minutos: { type: integer, minimum: 1 }
        satisfaccion_docente: { type: integer, minimum: 1, maximum: 5 }
        aprendizajes_clave: { type: string, minLength: 20 }
        dificultades: { type: [string, 'null'] }
        reutilizaria: { type: boolean }

    SesionJuegoResumen:
      type: object
      description: camelCase (inconsistente con el resto de la API; ver Fase 2)
      required: [id, fecha, productoId, nombreProducto, grupo, estudiantes, duracionMinutos, satisfaccion, aprendizajes]
      properties:
        id: { type: string, format: uuid }
        fecha: { type: string, format: date-time }
        productoId: { type: string, format: uuid }
        nombreProducto: { type: string }
        grupo: { type: string }
        estudiantes: { type: integer }
        duracionMinutos: { type: integer }
        satisfaccion: { type: integer }
        aprendizajes: { type: string }

    SesionJuegoDetalle:
      allOf:
        - $ref: '#/components/schemas/SesionJuegoResumen'
        - type: object
          required: [dificultades, reutilizaria, registradaEn]
          properties:
            dificultades: { type: [string, 'null'] }
            reutilizaria: { type: boolean }
            registradaEn: { type: string, format: date-time }

    ProductoAdminInput:
      type: object
      description: >
        Reglas cruzadas (Zod .refine): `marca_propia = true` ⇒ sin `url_externa`; de terceros ⇒
        `url_externa` obligatoria (RN-003/004). `umbral_mayorista` y
        `descuento_mayorista_porcentaje` van los dos o ninguno (RN-005 / CU-22).
      required: [titulo, descripcion, precio, stock, marca_propia]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 200 }
        descripcion: { type: string, minLength: 1 }
        precio: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        marca_propia: { type: boolean }
        url_externa: { type: [string, 'null'], format: uri }
        categoria_id: { type: [string, 'null'], format: uuid }
        umbral_mayorista: { type: [integer, 'null'], minimum: 1, description: Cantidad mínima para el descuento (CU-22) }
        descuento_mayorista_porcentaje: { type: [number, 'null'], minimum: 0, maximum: 100 }
        imagen_url: { type: [string, 'null'], format: uri, description: La que devuelve POST /admin/products/imagen }

    ProductoAdmin:
      type: object
      required:
        - id
        - titulo
        - descripcion
        - precio
        - stock
        - marca_propia
        - url_externa
        - categoria_id
        - umbral_mayorista
        - descuento_mayorista_porcentaje
        - imagen_url
        - activo
        - creado_en
        - actualizado_en
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descripcion: { type: string }
        precio: { type: number }
        stock: { type: integer }
        marca_propia: { type: boolean }
        url_externa: { type: [string, 'null'] }
        categoria_id: { type: [string, 'null'], format: uuid }
        umbral_mayorista: { type: [integer, 'null'] }
        descuento_mayorista_porcentaje: { type: [number, 'null'] }
        imagen_url: { type: [string, 'null'] }
        activo: { type: boolean }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    ProductoAdminFila:
      type: object
      required: [id, titulo, precio, stock, activo, tiene_demo, umbral_mayorista, descuento_mayorista_porcentaje, tiene_ordenes]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        precio: { type: number }
        stock: { type: integer }
        activo: { type: boolean }
        tiene_demo: { type: boolean }
        umbral_mayorista: { type: [integer, 'null'], description: 'null = "Sin configuración" (CU-22 A8)' }
        descuento_mayorista_porcentaje: { type: [number, 'null'] }
        tiene_ordenes: { type: boolean, description: Para la advertencia no bloqueante de CU-22 A11 }

    ConfiguracionDemo:
      type: object
      description: JSON libre; el catálogo público lee estas tres claves.
      additionalProperties: true
      properties:
        tipo: { type: string, enum: [publica, completa] }
        formato: { type: string, enum: [html5, pdf, video] }
        contenido_ref: { type: string, description: URL del contenido a embeber }
        unity_webgl_url: { type: string, format: uri }

    DemoAdminVista:
      type: object
      required: [asignada, id, producto_id, configuracion_json]
      properties:
        asignada: { type: boolean }
        id: { type: [string, 'null'], format: uuid }
        producto_id: { type: string, format: uuid }
        configuracion_json:
          oneOf:
            - $ref: '#/components/schemas/ConfiguracionDemo'
            - type: 'null'

    Categoria:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    CategoriaInput:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }

    RecursoAdminInput:
      type: object
      required: [titulo, tipo, url, licenciado]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 200 }
        tipo: { type: string, enum: [pdf, link], description: RN-009 }
        url:
          type: string
          minLength: 1
          description: Para `pdf`, el path de POST /admin/resources/pdf; para `link`, una URL externa (no se valida su formato).
        licenciado: { type: boolean }
        producto_id: { type: [string, 'null'], format: uuid }

    RecursoAdmin:
      type: object
      required: [id, titulo, tipo, url, licenciado, producto_id]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        tipo: { type: string, enum: [pdf, link] }
        url: { type: string }
        licenciado: { type: boolean }
        producto_id: { type: [string, 'null'], format: uuid }

    Readiness:
      type: object
      required: [status, dependencias]
      properties:
        status: { type: string, enum: [ok, down] }
        dependencias:
          type: object
          properties:
            db: { type: string, enum: [ok, down] }
