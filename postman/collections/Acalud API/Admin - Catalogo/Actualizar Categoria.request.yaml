$kind: http-request
name: 'Actualizar Categoría (Admin)'
method: PUT
url: '{{baseUrl}}/api/v1/admin/categories/{{category_id}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ciencias"
    }
