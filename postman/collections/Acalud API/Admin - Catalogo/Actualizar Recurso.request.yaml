$kind: http-request
name: Actualizar Recurso (Admin)
method: PUT
url: '{{baseUrl}}/api/v1/admin/resources/{{resource_id}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Guía Docente Actualizada",
      "tipo": "pdf",
      "url": "https://storage.example.com/guia-v2.pdf",
      "licenciado": true,
      "producto_id": "{{product_id}}"
    }
