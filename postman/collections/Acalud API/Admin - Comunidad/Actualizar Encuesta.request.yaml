$kind: http-request
name: Actualizar Encuesta (Admin)
method: PUT
url: '{{baseUrl}}/api/v1/admin/polls/{{poll_id}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "pregunta": "¿Qué área educativa prefieren? (actualizada)",
      "nivel_educativo_id": null,
      "opciones": ["Matemáticas", "Ciencias", "Lengua", "Historia"]
    }
